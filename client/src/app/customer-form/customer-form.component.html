<div class="form-container">
  <h2>🚗 HOV Violation Check</h2>

  <form (ngSubmit)="submitForm()" #hovForm="ngForm">
    <div class="form-group">
      <label for="make">Make</label>
      <input type="text" id="make" name="make" [(ngModel)]="form.make" required />
    </div>

    

    <div class="form-group">
      <label for="model">Model</label>
      <input type="text" id="model" name="model" [(ngModel)]="form.model" required />
    </div>

    <div class="form-group">
      <label for="weight">Total Weight (lbs)</label>
      <input type="number" id="weight" name="weight" [(ngModel)]="form.weight" required min="1" />
      <div *ngIf="showWeightHint" class="weight-hint">
        Minimum weight for this vehicle: {{ minWeight }}lbs
      </div>
    </div>

    <div class="form-group">
      <label for="licensePlate">License Plate</label>
      <input type="text" id="licensePlate" name="licensePlate" [(ngModel)]="form.licensePlate" required />
    </div>

    <button type="submit" class="btn" [disabled]="!hovForm.form.valid || loading">
      {{ loading ? 'Checking...' : 'Check Violation' }}
    </button>

    <button type="button" class="btn reset-btn" (click)="resetForm()" [disabled]="loading">
      Reset Form
    </button>
  </form>

  <div *ngIf="loading" class="loading">
    <div class="spinner"></div>
    Processing your request...
  </div>

  <div *ngIf="resultMessage" class="result-box">
    <p [class.violation]="violation" [class.success]="!violation">{{ resultMessage }}</p>

    <div *ngIf="violation && customer" class="customer-info">
      <h4>Violation Details</h4>
      <p><strong>Name:</strong> {{ customer.firstName }} {{ customer.lastName }}</p>
      <p><strong>Email:</strong> {{ customer.email }}</p>
      <p><strong>Phone:</strong> {{ customer.phone }}</p>

      <div class="notification-group">
        <label>Notify customer via:</label>
        <select [(ngModel)]="form.notificationMethod" name="notificationMethod">
          <option value="email">Email</option>
          <option value="sms">SMS</option>
        </select>
        <button class="btn notify-btn" (click)="sendNotification()" [disabled]="loading">
          {{ loading ? 'Sending...' : 'Send Notification' }}
        </button>
      </div>
    </div>
  </div>

  <p *ngIf="finalMessage" class="final-msg">{{ finalMessage }}</p>
</div>
